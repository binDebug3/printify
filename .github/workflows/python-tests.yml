name: Run Printify Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install pandas, requests, and pytest (needed to run tests)
        pip install -r requirements.txt
        pip install pytest 

    - name: Run Pytest
      run: |
        # This tells pytest to look specifically in your tests folder
        # -v provides a "verbose" output so you can see each test name
        python -m compileall .
        pytest printify/tests -v
